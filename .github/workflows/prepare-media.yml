name: Prepare campaign media
on:
  push:
    paths:
      - .github/workflows/prepare-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  place-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match the HTML media paths
        run: |
          mkdir -p media
          cp campaign_teaser.mp4 campaign_teaser_poster.jpg media/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/
          if ! git diff --cached --quiet; then
            git commit -m "Place teaser assets at HTML media paths"
            git push
          fi
